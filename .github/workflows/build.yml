name: Build Wheels
run-name: "Build ${{ inputs.package }} wheels${{ inputs.platform != 'all' && format(' [{0}]', inputs.platform) || '' }}${{ inputs.cuda != 'all' && format(' cu{0}', inputs.cuda) || '' }}${{ inputs.pytorch != 'all' && inputs.pytorch != '' && format(' torch{0}', inputs.pytorch) || '' }}${{ inputs.python != 'all' && inputs.python != '' && format(' py{0}', inputs.python) || '' }}${{ inputs.overwrite == true && ' (overwrite)' || '' }}${{ inputs.runner == 'self-hosted' && ' [self-hosted]' || '' }}${{ inputs.max_jobs != '0' && format(' max_jobs={0}', inputs.max_jobs) || '' }}"

on:
  workflow_dispatch:
    inputs:
      update_index:
        description: 'Regenerate + deploy the index after the build (default: no — dispatch Update Index separately)'
        required: false
        type: boolean
        default: false
      package:
        description: 'Package to build (or "all")'
        required: true
        type: choice
        options:
          - all
          - sageattention
          - sageattn3
          - gsplat
          - nvdiffrast
          - torch_generic_nms
          - cc_torch
          - flex_gemm
          - flex_gemm_ap
          - cumesh
          - cubvh
          - o_voxel
          - nvdiffrec_render
          - dpvo_cuda
          - pytorch3d
          - cumm
          - spconv
          - flash_attn
          - torch_cluster
          - torch_scatter
          - torch_sparse
          - o_voxel_vb
          - o_voxel_vb_ap
          - cumesh_vb
          - flex_gemm_vb
          - detectron2
          - pyg_lib
          - torch_spline_conv
          - drtk
          - diff_gaussian_rasterization
          - simple_knn
          - natten
          - flex_gemm_sharded
          - flex_gemm_sequential
          - pytorch3d_sequential
          - natten_sequential
          - fused_ssim
          - gsplat_maskgaussian
          - mmcv
          - faithc_aot
          - diso
          - pointnet2_ops
          - vox2seq
          - custom_rasterizer_hy3d2
          - nunchaku
          - torchao
          - torchsparse
          - vllm
          - flashinfer
          - llama_cpp_python
      overwrite:
        description: 'Rebuild and overwrite existing wheels'
        required: false
        type: boolean
        default: false
      platform:
        description: 'Platform filter (or "all")'
        required: false
        type: choice
        options:
          - all
          - linux
          - windows
        default: all
      cuda:
        description: 'CUDA version filter (or "all")'
        required: false
        type: choice
        options:
          - all
          - "12.4"
          - "12.6"
          - "12.8"
          - "12.9"
          - "13.0"
          - "13.2"
        default: all
      pytorch:
        description: 'PyTorch version filter — full (e.g. "2.11.0") or major.minor (e.g. "2.11"), or "all"'
        required: false
        type: string
        default: 'all'
      python:
        description: 'Python version filter — e.g. "3.12", or "all"'
        required: false
        type: string
        default: 'all'
      runner:
        description: 'Runner type'
        required: false
        type: choice
        options:
          - github
          - self-hosted
        default: github
      max_jobs:
        description: 'Max parallel compilation jobs (0 = use package default)'
        required: false
        type: string
        default: '0'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate build matrix
        id: generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OVERWRITE_FLAG=""
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            OVERWRITE_FLAG="--overwrite"
          fi
          python scripts/generate_matrix.py --package "${{ inputs.package }}" --platform "${{ inputs.platform || 'all' }}" --cuda "${{ inputs.cuda || 'all' }}" --pytorch "${{ inputs.pytorch || 'all' }}" --python "${{ inputs.python || 'all' }}" --output matrix.json $OVERWRITE_FLAG
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  build-linux:
    name: Linux ${{ matrix.package }} py${{ matrix.python }} cu${{ matrix.cuda_short }} torch${{ matrix.pytorch }}
    needs: generate-matrix
    # Skip when the linux matrix is empty (mirrors build-windows guard).
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).linux.include[0] != null }}
    # GitHub imposes a DEFAULT job timeout of 360 min even on self-hosted
    # runners; without raising it the homelab has a phantom 6h cap. Hosted
    # runners stay hard-capped at 6h regardless of this value.
    timeout-minutes: 2880
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","cuda"]') || 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix).linux }}
    permissions:
      contents: read

    steps:
      - name: Free disk space
        if: matrix.free_disk_space == true
        run: |
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /usr/share/swift &
          sudo rm -rf /usr/local/graalvm &
          sudo rm -rf /usr/local/.ghcup &
          sudo rm -rf /opt/hostedtoolcache/go &
          sudo apt-get clean &
          wait
          df -h

      - uses: actions/checkout@v4

      - name: Compute wheel filename
        id: meta
        run: |
          # Version detection is done in generate_matrix.py - just use matrix values
          PKG_NAME="${{ matrix.package }}"
          PKG_VERSION="${{ matrix.version }}"
          CUDA_SHORT="${{ matrix.cuda_short }}"
          TORCH_SHORT=$(echo "${{ matrix.pytorch }}" | cut -d. -f1,2)
          PY_SHORT=$(echo "${{ matrix.python }}" | tr -d '.')
          # Prefix without platform tag (auditwheel changes linux_x86_64 → manylinux_*)
          WHEEL_PREFIX="${PKG_NAME}-${PKG_VERSION}+cu${CUDA_SHORT}torch${TORCH_SHORT}-cp${PY_SHORT}-cp${PY_SHORT}-"

          echo "wheel_prefix=$WHEEL_PREFIX" >> $GITHUB_OUTPUT
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "pkg_version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Check if wheel exists in release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WHEEL_PREFIX="${{ steps.meta.outputs.wheel_prefix }}"
          RELEASE="${{ matrix.package }}-latest"
          echo "Checking release $RELEASE for: ${WHEEL_PREFIX}*.whl"
          mkdir -p dist

          if [ "${{ inputs.overwrite }}" = "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Overwrite enabled, will rebuild"
          else
            # Require manylinux (auditwheel-repaired) wheels on Linux
            MATCHING=$({ gh release view "$RELEASE" --json assets -q ".assets[].name" 2>/dev/null || true; } | grep "^${WHEEL_PREFIX}" | grep "manylinux" | head -1 || true)
            if [ -n "$MATCHING" ]; then
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "::notice::Wheel exists in release: $MATCHING"
              gh release download "$RELEASE" -p "$MATCHING" -D dist
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "::notice::No manylinux wheel found matching: ${WHEEL_PREFIX}*"
            fi
          fi

      - name: Setup CUDA
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/setup-cuda
        with:
          cuda-version: ${{ matrix.cuda }}
          platform: linux
          installer-type: ${{ matrix.cuda_installer }}
          extra-components: ${{ matrix.extra_cuda_components }}

      - name: Setup build environment
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python }}
          pytorch-version: ${{ matrix.pytorch }}
          cuda-short: ${{ matrix.cuda_short }}
          platform: linux
          extra-deps: ${{ matrix.extra_deps }}

      - name: Add swap space
        if: steps.check.outputs.exists != 'true' && (matrix.package == 'sageattention' || matrix.package == 'sageattn3' || matrix.package == 'natten' || matrix.package == 'pytorch3d_sequential')
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Build wheel
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/build-wheel
        with:
          source-repo: ${{ matrix.source_repo }}
          source-tag: ${{ matrix.source_tag }}
          pre-build-script: ${{ matrix.pre_build_script }}
          arch-list: ${{ matrix.arch_list }}
          cuda-version: ${{ matrix.cuda }}
          cuda-short: ${{ matrix.cuda_short }}
          pytorch-version: ${{ matrix.pytorch }}
          platform: linux
          max-jobs: ${{ inputs.max_jobs != '0' && inputs.max_jobs || matrix.max_jobs }}
          clone-recursive: ${{ matrix.clone_recursive }}
          patch-script: ${{ matrix.patch_script }}
          build-subdir: ${{ matrix.build_subdir }}
          nvcc-flags: ${{ matrix.nvcc_flags }}
          shard-index: ${{ matrix.shard_index }}
          shard-count: ${{ matrix.shard_count }}
          package: ${{ matrix.package }}
          python-version: ${{ matrix.python }}

      - name: Upload artifact
        # Compile-shard jobs upload their .o tarball via the build-wheel action's
        # own upload step; this wheel-upload only runs in full-build mode.
        # Mid-chain sequential-checkpoint jobs also produce no wheel (the chain
        # link upload's its checkpoint tarball + triggers a successor instead);
        # `if-no-files-found: ignore` lets the step succeed when dist/ is empty.
        # Also require that this job actually produced a wheel. Without the
        # `exists` check a job that found its wheel already published downloads
        # it into dist/ and re-uploads it here, and the release job then puts it
        # back with `--clobber` -- a delete-then-upload of a live asset, for no
        # gain. Combined with a transient `gh` failure in the skip check that is
        # a whole package's assets deleted and recreated.
        if: matrix.shard_count == 0 && steps.check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-linux-py${{ matrix.python }}-cu${{ matrix.cuda_short }}-torch${{ matrix.pytorch }}
          path: dist/*.whl
          if-no-files-found: ignore


  build-linux-aarch64:
    name: ARM ${{ matrix.package }} py${{ matrix.python }} cu${{ matrix.cuda_short }} torch${{ matrix.pytorch }}
    needs: generate-matrix
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).linux_aarch64.include[0] != null }}
    # GitHub's hosted ARM runners (free for public repos). No self-hosted
    # ARM machines exist in the homelab, so no runner switch here.
    # GitHub imposes a DEFAULT job timeout of 360 min even on self-hosted
    # runners; without raising it the homelab has a phantom 6h cap. Hosted
    # runners stay hard-capped at 6h regardless of this value.
    timeout-minutes: 2880
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix).linux_aarch64 }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Compute wheel filename
        id: meta
        run: |
          PKG_NAME="${{ matrix.package }}"
          PKG_VERSION="${{ matrix.version }}"
          CUDA_SHORT="${{ matrix.cuda_short }}"
          TORCH_SHORT=$(echo "${{ matrix.pytorch }}" | cut -d. -f1,2)
          PY_SHORT=$(echo "${{ matrix.python }}" | tr -d '.')
          WHEEL_PREFIX="${PKG_NAME}-${PKG_VERSION}+cu${CUDA_SHORT}torch${TORCH_SHORT}-cp${PY_SHORT}-cp${PY_SHORT}-"
          echo "wheel_prefix=$WHEEL_PREFIX" >> $GITHUB_OUTPUT

      - name: Check if wheel exists in release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WHEEL_PREFIX="${{ steps.meta.outputs.wheel_prefix }}"
          RELEASE="${{ matrix.package }}-latest"
          echo "Checking release $RELEASE for: ${WHEEL_PREFIX}*aarch64*.whl"
          mkdir -p dist
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Overwrite enabled, will rebuild"
          else
            MATCHING=$({ gh release view "$RELEASE" --json assets -q ".assets[].name" 2>/dev/null || true; } | grep "^${WHEEL_PREFIX}" | grep "aarch64" | head -1 || true)
            if [ -n "$MATCHING" ]; then
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "::notice::Wheel exists in release: $MATCHING"
            else
              echo "exists=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Setup CUDA
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/setup-cuda
        with:
          cuda-version: ${{ matrix.cuda }}
          platform: linux
          installer-type: ${{ matrix.cuda_installer }}
          extra-components: ${{ matrix.extra_cuda_components }}

      - name: Setup build environment
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python }}
          pytorch-version: ${{ matrix.pytorch }}
          cuda-short: ${{ matrix.cuda_short }}
          platform: linux
          extra-deps: ${{ matrix.extra_deps }}

      - name: Build wheel
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/build-wheel
        with:
          source-repo: ${{ matrix.source_repo }}
          source-tag: ${{ matrix.source_tag }}
          pre-build-script: ${{ matrix.pre_build_script }}
          arch-list: ${{ matrix.arch_list }}
          cuda-version: ${{ matrix.cuda }}
          cuda-short: ${{ matrix.cuda_short }}
          pytorch-version: ${{ matrix.pytorch }}
          platform: linux
          max-jobs: ${{ inputs.max_jobs != '0' && inputs.max_jobs || matrix.max_jobs }}
          clone-recursive: ${{ matrix.clone_recursive }}
          patch-script: ${{ matrix.patch_script }}
          build-subdir: ${{ matrix.build_subdir }}
          nvcc-flags: ${{ matrix.nvcc_flags }}
          shard-index: 0
          shard-count: 0
          package: ${{ matrix.package }}
          python-version: ${{ matrix.python }}

      - name: Upload artifact
        if: steps.check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-linux_aarch64-py${{ matrix.python }}-cu${{ matrix.cuda_short }}-torch${{ matrix.pytorch }}
          path: dist/*.whl
          if-no-files-found: ignore

  link-linux:
    name: Link ${{ matrix.package }} py${{ matrix.python }} cu${{ matrix.cuda_short }} torch${{ matrix.pytorch }}
    # Runs after compile-shard jobs finish. Only fans out for sharded packages
    # (link-matrix is empty for unsharded — the job is then skipped entirely
    # because the strategy matrix has no entries to iterate over).
    # generate-matrix is in needs because we reference its `matrix` output;
    # GH Actions only exposes outputs from direct needs.
    needs: [generate-matrix, build-linux]
    if: ${{ needs.build-linux.result != 'cancelled' && fromJson(needs.generate-matrix.outputs.matrix).linux_link.include[0] != null }}
    # GitHub imposes a DEFAULT job timeout of 360 min even on self-hosted
    # runners; without raising it the homelab has a phantom 6h cap. Hosted
    # runners stay hard-capped at 6h regardless of this value.
    timeout-minutes: 2880
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","cuda"]') || 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix).linux_link }}
    permissions:
      contents: read

    steps:
      - name: Free disk space
        if: matrix.free_disk_space == true
        run: |
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /usr/share/swift &
          sudo rm -rf /usr/local/graalvm &
          sudo rm -rf /usr/local/.ghcup &
          sudo rm -rf /opt/hostedtoolcache/go &
          sudo apt-get clean &
          wait
          df -h

      - uses: actions/checkout@v4

      - name: Setup CUDA
        uses: ./.github/actions/setup-cuda
        with:
          cuda-version: ${{ matrix.cuda }}
          platform: linux
          installer-type: ${{ matrix.cuda_installer }}
          extra-components: ${{ matrix.extra_cuda_components }}

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python }}
          pytorch-version: ${{ matrix.pytorch }}
          cuda-short: ${{ matrix.cuda_short }}
          platform: linux
          extra-deps: ${{ matrix.extra_deps }}

      - name: Link sharded wheel
        # link-only: true tells the action to download all N shard artifacts
        # for this (pkg, py, cuda, torch) tuple, extract them into build/temp,
        # and run pip wheel which will link-only (skip recompile since .o's are
        # already present and fresh).
        uses: ./.github/actions/build-wheel
        with:
          source-repo: ${{ matrix.source_repo }}
          source-tag: ${{ matrix.source_tag }}
          pre-build-script: ${{ matrix.pre_build_script }}
          arch-list: ${{ matrix.arch_list }}
          cuda-version: ${{ matrix.cuda }}
          cuda-short: ${{ matrix.cuda_short }}
          pytorch-version: ${{ matrix.pytorch }}
          platform: linux
          max-jobs: ${{ inputs.max_jobs != '0' && inputs.max_jobs || matrix.max_jobs }}
          clone-recursive: ${{ matrix.clone_recursive }}
          patch-script: ${{ matrix.patch_script }}
          build-subdir: ${{ matrix.build_subdir }}
          nvcc-flags: ${{ matrix.nvcc_flags }}
          shard-index: '0'
          shard-count: ${{ matrix.shard_count }}
          link-only: 'true'
          package: ${{ matrix.package }}
          python-version: ${{ matrix.python }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-linux-py${{ matrix.python }}-cu${{ matrix.cuda_short }}-torch${{ matrix.pytorch }}
          path: dist/*.whl

  # ──────────────────────────────────────────────────────────────────────
  # Sequential-checkpoint chain (10 links). Each `uses:` call invokes the
  # reusable workflow `_chain_link.yml`, which contains the full per-link
  # logic. Links are wired with `needs:` so they run sequentially in the
  # SAME workflow run. The `if:` clause gates each link on the previous
  # one's `done` output: as soon as a link completes the build (done=true),
  # every subsequent link is skipped. Setting `result == 'success' &&
  # outputs.done == 'false'` (rather than `outputs.done != 'true'`) means
  # skipped/failed/cancelled predecessors also short-circuit the chain.
  build-linux-chain-link-0:
    needs: generate-matrix
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).linux_chain.include[0] != null }}
    uses: ./.github/workflows/_chain_link.yml
    with:
      iter: 0
      matrix_json: ${{ needs.generate-matrix.outputs.matrix }}
      runner: ${{ inputs.runner }}
      max_jobs_override: ${{ inputs.max_jobs }}
      overwrite: ${{ inputs.overwrite }}
    secrets: inherit

  build-linux-chain-link-1:
    needs: [generate-matrix, build-linux-chain-link-0]
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).linux_chain.include[0] != null && needs.build-linux-chain-link-0.result == 'success' && needs.build-linux-chain-link-0.outputs.done == 'false' }}
    uses: ./.github/workflows/_chain_link.yml
    with:
      iter: 1
      matrix_json: ${{ needs.generate-matrix.outputs.matrix }}
      runner: ${{ inputs.runner }}
      max_jobs_override: ${{ inputs.max_jobs }}
      overwrite: ${{ inputs.overwrite }}
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────
  # Windows mirror of the Linux chain (build-linux-chain-link-0..9). Same
  # 10-job ladder, each `uses: _chain_link_windows.yml`. Wires gated the
  # same way: each link runs only if the previous succeeded with done=false.
  build-windows-chain-link-0:
    needs: generate-matrix
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).windows_chain.include[0] != null }}
    uses: ./.github/workflows/_chain_link_windows.yml
    with:
      iter: 0
      matrix_json: ${{ needs.generate-matrix.outputs.matrix }}
      runner: ${{ inputs.runner }}
      max_jobs_override: ${{ inputs.max_jobs }}
      overwrite: ${{ inputs.overwrite }}
    secrets: inherit

  build-windows-chain-link-1:
    needs: [generate-matrix, build-windows-chain-link-0]
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).windows_chain.include[0] != null && needs.build-windows-chain-link-0.result == 'success' && needs.build-windows-chain-link-0.outputs.done == 'false' }}
    uses: ./.github/workflows/_chain_link_windows.yml
    with:
      iter: 1
      matrix_json: ${{ needs.generate-matrix.outputs.matrix }}
      runner: ${{ inputs.runner }}
      max_jobs_override: ${{ inputs.max_jobs }}
      overwrite: ${{ inputs.overwrite }}
    secrets: inherit

  build-windows:
    name: Windows ${{ matrix.package }} py${{ matrix.python }} cu${{ matrix.cuda_short }} torch${{ matrix.pytorch }}
    needs: generate-matrix
    # Skip when the windows matrix is empty (e.g. a linux-only sharded
    # package). Without this guard GH Actions errors with
    # "matrix must define at least one vector" and flags the whole
    # workflow as failure even though release succeeds.
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).windows.include[0] != null }}
    # GitHub imposes a DEFAULT job timeout of 360 min even on self-hosted
    # runners; without raising it the homelab has a phantom 6h cap. Hosted
    # runners stay hard-capped at 6h regardless of this value.
    timeout-minutes: 2880
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted","windows"]') || 'windows-2022' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix).windows }}
    permissions:
      contents: read

    steps:

      - name: Ensure Git\bin on PATH (so shell:bash works)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Runner identity (debug)
        shell: powershell
        run: |
          echo "runner.name=${{ runner.name }} runner.os=${{ runner.os }} hostname=$env:COMPUTERNAME user=$(whoami)"
          echo "--- whoami /groups ---"
          whoami /groups | Select-String -Pattern "docker|admin|users|service|network" -CaseSensitive:$false
          echo "--- end debug ---"
      - name: Enable long paths
        shell: powershell
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Compute wheel filename
        id: meta
        shell: bash
        run: |
          # Version detection is done in generate_matrix.py - just use matrix values
          PKG_NAME="${{ matrix.package }}"
          PKG_VERSION="${{ matrix.version }}"
          CUDA_SHORT="${{ matrix.cuda_short }}"
          TORCH_SHORT=$(echo "${{ matrix.pytorch }}" | cut -d. -f1,2)
          PY_SHORT=$(echo "${{ matrix.python }}" | tr -d '.')
          WHEEL_PREFIX="${PKG_NAME}-${PKG_VERSION}+cu${CUDA_SHORT}torch${TORCH_SHORT}-cp${PY_SHORT}-cp${PY_SHORT}-"

          echo "wheel_prefix=$WHEEL_PREFIX" >> $GITHUB_OUTPUT
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "pkg_version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Check if wheel exists in release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WHEEL_PREFIX="${{ steps.meta.outputs.wheel_prefix }}"
          RELEASE="${{ matrix.package }}-latest"
          echo "Checking release $RELEASE for: ${WHEEL_PREFIX}*.whl"
          mkdir -p dist

          if [ "${{ inputs.overwrite }}" = "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Overwrite enabled, will rebuild"
          else
            MATCHING=$({ gh release view "$RELEASE" --json assets -q ".assets[].name" 2>/dev/null || true; } | grep "^${WHEEL_PREFIX}" | grep "win_amd64" | head -1 || true)
            if [ -n "$MATCHING" ]; then
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "::notice::Wheel exists in release: $MATCHING"
              gh release download "$RELEASE" -p "$MATCHING" -D dist
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "::notice::No win_amd64 wheel found matching: ${WHEEL_PREFIX}*"
            fi
          fi

      - name: Setup CUDA
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/setup-cuda
        with:
          cuda-version: ${{ matrix.cuda }}
          platform: windows
          installer-type: ${{ matrix.cuda_installer }}
          extra-components: ${{ matrix.extra_cuda_components }}

      - name: Setup build environment
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python }}
          pytorch-version: ${{ matrix.pytorch }}
          cuda-short: ${{ matrix.cuda_short }}
          platform: windows
          extra-deps: ${{ matrix.extra_deps }}

      - name: Build wheel
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/build-wheel
        with:
          source-repo: ${{ matrix.source_repo }}
          source-tag: ${{ matrix.source_tag }}
          pre-build-script: ${{ matrix.pre_build_script }}
          arch-list: ${{ matrix.arch_list }}
          cuda-version: ${{ matrix.cuda }}
          cuda-short: ${{ matrix.cuda_short }}
          pytorch-version: ${{ matrix.pytorch }}
          platform: windows
          max-jobs: ${{ inputs.max_jobs != '0' && inputs.max_jobs || matrix.max_jobs }}
          clone-recursive: ${{ matrix.clone_recursive }}
          patch-script: ${{ matrix.patch_script }}
          build-subdir: ${{ matrix.build_subdir }}
          nvcc-flags: ${{ matrix.nvcc_flags }}
          shard-index: ${{ matrix.shard_index }}
          shard-count: ${{ matrix.shard_count }}
          package: ${{ matrix.package }}
          python-version: ${{ matrix.python }}

      - name: Upload artifact
        # Compile-shard jobs upload their .o tarball via the build-wheel action's
        # own upload step; this wheel-upload only runs in full-build mode.
        # Also require that this job actually produced a wheel. Without the
        # `exists` check a job that found its wheel already published downloads
        # it into dist/ and re-uploads it here, and the release job then puts it
        # back with `--clobber` -- a delete-then-upload of a live asset, for no
        # gain. Combined with a transient `gh` failure in the skip check that is
        # a whole package's assets deleted and recreated.
        if: matrix.shard_count == 0 && steps.check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-windows-py${{ matrix.python }}-cu${{ matrix.cuda_short }}-torch${{ matrix.pytorch }}
          path: dist/*.whl

  link-windows:
    name: Link ${{ matrix.package }} py${{ matrix.python }} cu${{ matrix.cuda_short }} torch${{ matrix.pytorch }} (Windows)
    # Mirror of link-linux for sharded Windows packages.
    needs: [generate-matrix, build-windows]
    if: ${{ needs.build-windows.result != 'cancelled' && fromJson(needs.generate-matrix.outputs.matrix).windows_link.include[0] != null }}
    # GitHub imposes a DEFAULT job timeout of 360 min even on self-hosted
    # runners; without raising it the homelab has a phantom 6h cap. Hosted
    # runners stay hard-capped at 6h regardless of this value.
    timeout-minutes: 2880
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted","windows"]') || 'windows-2022' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix).windows_link }}
    permissions:
      contents: read

    steps:
      - name: Ensure Git\bin on PATH (so shell:bash works)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Enable long paths
        shell: powershell
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Setup CUDA
        uses: ./.github/actions/setup-cuda
        with:
          cuda-version: ${{ matrix.cuda }}
          platform: windows
          installer-type: ${{ matrix.cuda_installer }}
          extra-components: ${{ matrix.extra_cuda_components }}

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python }}
          pytorch-version: ${{ matrix.pytorch }}
          cuda-short: ${{ matrix.cuda_short }}
          platform: windows
          extra-deps: ${{ matrix.extra_deps }}

      - name: Link sharded wheel
        uses: ./.github/actions/build-wheel
        with:
          source-repo: ${{ matrix.source_repo }}
          source-tag: ${{ matrix.source_tag }}
          pre-build-script: ${{ matrix.pre_build_script }}
          arch-list: ${{ matrix.arch_list }}
          cuda-version: ${{ matrix.cuda }}
          cuda-short: ${{ matrix.cuda_short }}
          pytorch-version: ${{ matrix.pytorch }}
          platform: windows
          max-jobs: ${{ inputs.max_jobs != '0' && inputs.max_jobs || matrix.max_jobs }}
          clone-recursive: ${{ matrix.clone_recursive }}
          patch-script: ${{ matrix.patch_script }}
          build-subdir: ${{ matrix.build_subdir }}
          nvcc-flags: ${{ matrix.nvcc_flags }}
          shard-index: '0'
          shard-count: ${{ matrix.shard_count }}
          link-only: 'true'
          package: ${{ matrix.package }}
          python-version: ${{ matrix.python }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-windows-py${{ matrix.python }}-cu${{ matrix.cuda_short }}-torch${{ matrix.pytorch }}
          path: dist/*.whl

  release:
    needs:
      - build-linux
      - build-linux-aarch64
      - link-linux
      - build-windows
      - link-windows
      - build-linux-chain-link-0
      - build-linux-chain-link-1
      - build-windows-chain-link-0
      - build-windows-chain-link-1
    # Release runs whenever ANY build/link/chain-link path produced a result
    # (not cancelled). Skipped chain links are normal (cascade-skip after a
    # link completes the build); we still want release to run.
    if: always() && (needs.build-linux.result != 'cancelled' || needs.build-linux-aarch64.result != 'cancelled' || needs.link-linux.result != 'cancelled' || needs.build-windows.result != 'cancelled' || needs.link-windows.result != 'cancelled' || needs.build-linux-chain-link-0.result == 'success' || needs.build-linux-chain-link-1.result == 'success' || needs.build-windows-chain-link-0.result == 'success' || needs.build-windows-chain-link-1.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create releases per package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Collect wheels and group by package. If artifacts/ doesn't exist
          # (no upstream job produced any artifacts -- e.g. every chain-link
          # was skipped after the first one completed and uploaded its wheel,
          # or every job failed pre-build), there's nothing to release.
          mkdir -p wheels
          if [ -d artifacts ]; then
            find artifacts -name "*.whl" -exec cp {} wheels/ \;
          else
            echo "::notice::no artifacts/ directory -- no wheels were uploaded; nothing to release"
            exit 0
          fi

          echo "Collected wheels:"
          ls -la wheels/

          # Extract unique package names from wheel filenames
          # Wheel format: <package>-<version>+<suffix>-<python>-...
          cd wheels
          for whl in *.whl; do
            if [ -f "$whl" ]; then
              # Extract package name (everything before first -)
              pkg=$(echo "$whl" | sed 's/-.*//')
              echo "Found package: $pkg"
              mkdir -p "../releases/$pkg"
              cp "$whl" "../releases/$pkg/"
            fi
          done
          cd ..

          # Create a release for each package
          for pkg_dir in releases/*/; do
            pkg=$(basename "$pkg_dir")
            echo "Creating release for: $pkg"

            # Example pin for the notes: the first wheel's full version INCLUDING
            # the combo tag, e.g. 1.5.3+cu128torch2.8. A complete local version
            # selects exactly one wheel, which is the only unambiguous install.
            example_pin=$(ls "$pkg_dir"/*.whl | head -1 | sed "s/.*${pkg}-//" | sed 's/-cp[0-9].*//')

            NOTES="Pre-built ${pkg} wheels with CUDA support."$'\n\n'"**Install** -- pick the build matching your installed torch and CUDA:"$'\n'"\`\`\`bash"$'\n'"pip install \"${pkg}==${example_pin}\" --extra-index-url https://pozzettiandrea.github.io/cuda-wheels/v2/"$'\n'"\`\`\`"$'\n\n'"This index is *selected from*, not resolved. A wheel's CUDA and torch versions live in its local version tag (\`+cu128torch2.8\`), and pip cannot match those against your environment -- an unpinned \`pip install ${pkg}\` resolves to the highest combo in this release, not the one your machine can load. Pin the exact build as above, or let the helper choose it:"$'\n'"https://pozzettiandrea.github.io/cuda-wheels/dashboard/install.html"
            gh release create "${pkg}-latest" \
              --title "${pkg} CUDA Wheels" \
              --notes "$NOTES" \
              --latest=false \
              "$pkg_dir"/*.whl \
            || gh release upload "${pkg}-latest" "$pkg_dir"/*.whl --clobber
          done

  update-index:
    needs: release
    # build.yml and update-index.yml both deploy ./docs to gh-pages with
    # force_orphan, which replaces the branch wholesale -- so two DEPLOYS
    # overlapping would silently overwrite each other. Serialise the deploy
    # JOB only: workflow-level concurrency put every build run into this
    # queue, where each new dispatch cancelled the pending index update (and
    # queued builds cancelled each other -- fatal for multi-package rollouts).
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    # Off by default: a build run should not be able to break the live index.
    # Freshly published wheels appear in the index on the next Update Index
    # run (push to main, manual dispatch, or a build dispatched with
    # update_index=true).
    if: always() && needs.release.result == 'success' && inputs.update_index == true
    runs-on: ubuntu-latest
    environment: deploy-index
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate PEP 503 index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_index.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true

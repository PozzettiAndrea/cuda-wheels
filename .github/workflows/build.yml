name: Build Wheels

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build (or "all")'
        required: true
        type: choice
        options:
          - all
          - sageattention

env:
  UPSTREAM_INDEX: "https://pozzettiandrea.github.io/cuda-wheels"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate build matrix
        id: generate
        run: |
          python scripts/generate_matrix.py --package "${{ inputs.package }}" --output matrix.json
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  build-linux:
    name: Linux ${{ matrix.package }} py${{ matrix.python }} cu${{ matrix.cuda_short }}
    needs: generate-matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix).linux }}
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo apt-get clean &
          wait
          df -h

      - uses: actions/checkout@v4

      - name: Compute wheel filename
        id: meta
        run: |
          CUDA_SHORT="${{ matrix.cuda_short }}"
          TORCH_SHORT=$(echo "${{ matrix.pytorch }}" | cut -d. -f1,2 | tr -d '.')
          PY_SHORT=$(echo "${{ matrix.python }}" | tr -d '.')
          WHEEL="${{ matrix.package }}-${{ matrix.version }}+cu${CUDA_SHORT}torch${TORCH_SHORT}-cp${PY_SHORT}-cp${PY_SHORT}-linux_x86_64.whl"
          echo "wheel_filename=$WHEEL" >> $GITHUB_OUTPUT

      - name: Check upstream index
        id: check
        run: |
          URL="${{ env.UPSTREAM_INDEX }}/${{ matrix.package }}/${{ steps.meta.outputs.wheel_filename }}"
          echo "Checking: $URL"
          mkdir -p dist
          if curl -sfI "$URL" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Wheel exists upstream, downloading: ${{ steps.meta.outputs.wheel_filename }}"
            curl -L -o "dist/${{ steps.meta.outputs.wheel_filename }}" "$URL"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Wheel not found upstream, will build: ${{ steps.meta.outputs.wheel_filename }}"
          fi

      - name: Setup CUDA
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/setup-cuda
        with:
          cuda-version: ${{ matrix.cuda }}
          platform: linux

      - name: Setup build environment
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python }}
          pytorch-version: ${{ matrix.pytorch }}
          cuda-short: ${{ matrix.cuda_short }}
          platform: linux
          extra-deps: ${{ matrix.extra_deps }}

      - name: Build wheel
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/build-wheel
        with:
          source-repo: ${{ matrix.source_repo }}
          source-tag: ${{ matrix.source_tag }}
          pre-build-script: ${{ matrix.pre_build_script }}
          arch-list: ${{ matrix.arch_list }}
          cuda-version: ${{ matrix.cuda }}
          cuda-short: ${{ matrix.cuda_short }}
          pytorch-version: ${{ matrix.pytorch }}
          platform: linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-linux-py${{ matrix.python }}-cu${{ matrix.cuda_short }}
          path: dist/*.whl

  build-windows:
    name: Windows ${{ matrix.package }} py${{ matrix.python }} cu${{ matrix.cuda_short }}
    needs: generate-matrix
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix).windows }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Compute wheel filename
        id: meta
        shell: bash
        run: |
          CUDA_SHORT="${{ matrix.cuda_short }}"
          TORCH_SHORT=$(echo "${{ matrix.pytorch }}" | cut -d. -f1,2 | tr -d '.')
          PY_SHORT=$(echo "${{ matrix.python }}" | tr -d '.')
          WHEEL="${{ matrix.package }}-${{ matrix.version }}+cu${CUDA_SHORT}torch${TORCH_SHORT}-cp${PY_SHORT}-cp${PY_SHORT}-win_amd64.whl"
          echo "wheel_filename=$WHEEL" >> $GITHUB_OUTPUT

      - name: Check upstream index
        id: check
        shell: bash
        run: |
          URL="${{ env.UPSTREAM_INDEX }}/${{ matrix.package }}/${{ steps.meta.outputs.wheel_filename }}"
          mkdir -p dist
          if curl -sfI "$URL" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            curl -L -o "dist/${{ steps.meta.outputs.wheel_filename }}" "$URL"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup CUDA
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/setup-cuda
        with:
          cuda-version: ${{ matrix.cuda }}
          platform: windows

      - name: Setup build environment
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python }}
          pytorch-version: ${{ matrix.pytorch }}
          cuda-short: ${{ matrix.cuda_short }}
          platform: windows
          extra-deps: ${{ matrix.extra_deps }}

      - name: Build wheel
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/build-wheel
        with:
          source-repo: ${{ matrix.source_repo }}
          source-tag: ${{ matrix.source_tag }}
          pre-build-script: ${{ matrix.pre_build_script }}
          arch-list: ${{ matrix.arch_list }}
          cuda-version: ${{ matrix.cuda }}
          cuda-short: ${{ matrix.cuda_short }}
          pytorch-version: ${{ matrix.pytorch }}
          platform: windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-windows-py${{ matrix.python }}-cu${{ matrix.cuda_short }}
          path: dist/*.whl

  release:
    needs: [build-linux, build-windows]
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect wheels
        run: |
          mkdir -p wheels
          find artifacts -name "*.whl" -exec cp {} wheels/ \;
          echo "Collected wheels:"
          ls -la wheels/

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CUDA Wheels
          files: wheels/*.whl
          make_latest: true

  update-index:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate PEP 503 index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_index.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true

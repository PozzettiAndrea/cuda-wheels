name: sageattention
source_repo: thu-ml/SageAttention
version: "2.2.0"
source_tag: v2.2.0

# Optional: free disk space before build (default: false)
# Needed because PyTorch 2.8.0 uv cache is 3.3GB + CUDA toolkit
free_disk_space: true

# Optional: parallel compilation jobs (default: 1)
# SageAttention builds multiple extensions in parallel, so keep this low
max_jobs: 1

build_matrix:
  combinations:
    - cuda: "12.4"
      pytorch: "2.4.0"
      python_versions: ["3.10", "3.11", "3.12"]  # PyTorch 2.4 doesn't support 3.13
      arch_list: "7.0;7.5;8.0;8.6;8.9;9.0;10.0"  # CUDA 12.4 doesn't support sm_120
    - cuda: "12.8"
      pytorch: "2.8.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
      arch_list: "7.0;7.5;8.0;8.6;8.9;9.0;10.0;12.0"  # CUDA 12.8 supports Blackwell
  platforms: ["linux", "windows"]

# Default arch_list (can be overridden per-combination)
arch_list: "7.0;7.5;8.0;8.6;8.9;9.0"
extra_deps: ""
pre_build_script: ""

name: sageattention
source_repo: thu-ml/SageAttention
version: "2.2.0"
source_tag: v2.2.0

# Optional: free disk space before build (default: false)
# Needed because PyTorch 2.8.0 uv cache is 3.3GB + CUDA toolkit
free_disk_space: true

# Optional: parallel compilation jobs (default: 1)
# SageAttention builds multiple extensions in parallel, so keep this low
max_jobs: 1

build_matrix:
  combinations:
    - cuda: "12.4"
      pytorch: "2.4.0"
      python_versions: ["3.12"]  # Test with single Python version first
      arch_list: "8.6;8.9;9.0"  # Minimal: RTX 30xx, RTX 40xx, H100
    - cuda: "12.8"
      pytorch: "2.8.0"
      python_versions: ["3.12"]  # Test with single Python version first
      arch_list: "8.6;8.9;9.0"  # Minimal: RTX 30xx, RTX 40xx, H100
  platforms: ["linux"]  # Linux only for test

# Default arch_list (can be overridden per-combination)
arch_list: "7.0;7.5;8.0;8.6;8.9;9.0"
extra_deps: ""
pre_build_script: ""

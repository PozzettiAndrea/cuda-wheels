name: cc_torch
source_repo: ronghanghu/cc_torch
source_tag: ""  # Use main branch

free_disk_space: true

build_matrix:
  combinations:
    # Older systems (CUDA 12.1)
    - cuda: "12.1"
      pytorch: "2.5.1"
      python_versions: ["3.10", "3.11", "3.12"]
    - cuda: "12.4"
      pytorch: "2.5.1"
      python_versions: ["3.10", "3.11", "3.12"]
    - cuda: "12.6"
      pytorch: "2.6.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    # Legacy ComfyUI portable (torch 2.7)
    - cuda: "12.6"
      pytorch: "2.7.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "12.6"
      pytorch: "2.8.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    # Newer torch on older CUDA
    - cuda: "12.6"
      pytorch: "2.9.1"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    # Blackwell + stable torch 2.7
    - cuda: "12.8"
      pytorch: "2.7.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "12.8"
      pytorch: "2.8.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "12.8"
      pytorch: "2.9.1"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "13.0"
      pytorch: "2.9.1"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
  platforms: ["linux", "windows"]

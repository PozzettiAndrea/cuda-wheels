name: lietorch
source_repo: princeton-vl/lietorch
version: "0.8.2"
source_tag: ""

free_disk_space: true

pre_build_script: |
  # Install Eigen headers (required by lietorch)
  curl -sL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz -o eigen.tar.gz
  tar -xzf eigen.tar.gz
  mv eigen-3.4.0 eigen

build_matrix:
  combinations:
    - cuda: "12.4"
      pytorch: "2.4.0"
      python_versions: ["3.10", "3.11", "3.12"]
    - cuda: "12.4"
      pytorch: "2.5.1"
      python_versions: ["3.10", "3.11", "3.12"]
    - cuda: "12.6"
      pytorch: "2.6.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "12.6"
      pytorch: "2.8.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "12.8"
      pytorch: "2.8.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "12.8"
      pytorch: "2.9.1"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
  platforms: ["linux", "windows"]

extra_deps: "numpy"

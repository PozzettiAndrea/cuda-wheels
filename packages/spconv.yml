name: spconv
source_repo: traveller59/spconv
source_tag: v2.3.8

extra_deps: "pccm>=0.4.16 ccimport>=0.4.4 cumm"

build_matrix:
  combinations:
    - cuda: "12.4"
      pytorch: "2.4.0"
      python_versions: ["3.10", "3.11", "3.12"]
    - cuda: "12.8"
      pytorch: "2.8.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
  platforms: ["linux", "windows"]

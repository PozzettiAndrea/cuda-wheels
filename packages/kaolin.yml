name: kaolin
# NVIDIA 3D deep-learning library.
# Gap this fills: NVIDIA's S3 index tops out at torch 2.8.0 and cp312 --
# no torch 2.9/2.10/2.11 pages, no cu130 page, no cp313/cp314 anywhere.
source_repo: NVIDIAGameWorks/kaolin
source_tag: v0.18.0
version: 0.18.0
clone_recursive: true
# setup.py hard-asserts TORCH_MIN_VER='2.5.1' <= torch <= TORCH_MAX_VER='2.12.1'
# and aborts otherwise, so torch 2.4.x cells must be excluded at the source.
min_pytorch: "2.5.1"

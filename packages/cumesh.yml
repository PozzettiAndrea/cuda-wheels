    - cuda: "12.6"
      pytorch: "2.8.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "12.8"
      pytorch: "2.8.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "12.8"
      pytorch: "2.9.1"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "13.0"
      pytorch: "2.9.1"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]

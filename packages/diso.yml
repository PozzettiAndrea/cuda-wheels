name: diso
source_repo: SarahWeiii/diso
source_tag: 9792ad928ccb09bdec938779651ee03e395758a6   # main @ 2025-05-01 (no tags upstream)
version: "0.1.4"
# Differentiable Iso-Surface Extraction (DiffMC / DiffDMC). Surface extraction
# for Hunyuan3D 2.1 + V2 and TripoSG; the highest-value missing wheel for
# ComfyUI-3D-Pack-enved. Upstream has no tags, so the pin is a commit.
#
# No patch_script needed:
#   * setup.py builds a single extension `diso._C` from src/*.cu -- no
#     hardcoded TORCH_CUDA_ARCH_LIST, so ours is respected.
#   * it falls back to CppExtension (CUDA-less!) when torch.cuda.is_available()
#     is false, which it is on a runner with no GPU -- but the build action
#     already exports FORCE_CUDA=1 on both platforms, which is exactly the
#     escape hatch its get_extensions() checks.
#   * nvcc flags come from $NVCC_FLAGS, defaulting to -O3.
# The `cxx: ["-O3"]` flag is gcc syntax; MSVC emits warning D9002 and ignores
# it rather than failing, so Windows is left unpatched on purpose.

build_matrix:
  # Combinations inherited from _defaults.yml: cu124-cu130 x torch 2.4-2.11 x
  # py3.10-3.14, each with its own per-combo arch_list. Proven on
  # cu128/torch2.8; the rest of the grid is what this build establishes.
  platforms: ["linux", "windows"]

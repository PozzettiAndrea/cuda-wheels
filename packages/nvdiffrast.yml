name: nvdiffrast
source_repo: NVlabs/nvdiffrast
version: "0.4.0"
source_tag: v0.4.0

free_disk_space: true

build_matrix:
  combinations:
    - cuda: "12.4"
      pytorch: "2.4.0"
      python_versions: ["3.10", "3.11", "3.12"]
      arch_list: "6.1 7.0 7.5 8.0 8.6 8.9 9.0"  # No 10.0/12.0 - PyTorch 2.4 doesn't support Blackwell
    - cuda: "12.8"
      pytorch: "2.8.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
      arch_list: "6.1 7.0 7.5 8.0 8.6 8.9 9.0 10.0 12.0"  # Includes Blackwell
  platforms: ["linux", "windows"]

extra_deps: "numpy"

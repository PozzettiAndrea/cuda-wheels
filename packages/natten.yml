name: natten
source_repo: SHI-Labs/NATTEN
source_tag: v0.21.6
patch_script: patches/natten.py
# NATTEN vendors CUTLASS as a submodule under third_party/.
clone_recursive: true
# Sharded compile: 16 shards split the ~144 autogen .cu files (sorted
# round-robin partition; each shard compiles ~9 files). patches/natten.py
# injects a post-autogen filter in setup.py that deletes the .cu files
# NOT in this shard's slice, gated on CUDA_WHEELS_SHARD_INDEX/COUNT env
# vars (set by the build-wheel action). Monolithic compile projects to
# 4-5h (close to GH Actions' 6h cap); sharded should be ~20-40min per shard.
sharding: 16
# Windows is back in scope: patches/natten.py strips sm_100/103 (Blackwell DC)
# from NATTEN_CUDA_ARCH on Windows so the MSVC-incompatible
# sm100_fmha_bwd_kernel_tma_warpspecialized.hpp (C2061) doesn't get pulled in.
# sm_120 (RTX 5090 / Blackwell consumer) is unaffected and still ships.
# CUTLASS template instantiations have large peak memory. max_jobs=4 OOM'd
# (exit 143 + runner shutdown signal) ~3min into Blackwell FMHA compile on
# 16GB Linux runner — each .cu peaks above the assumed 3.5GB. Backed off
# to 2 slots (with 8GB swap added in build.yml) paired with nvcc --threads=1
# (via nvcc_flags below) for single-threaded per-file compiles.
max_jobs: 2
# Force nvcc to single-threaded per file (NATTEN's CMakeLists doesn't pass
# --threads; without this, nvcc default is 1 anyway, but we make it explicit
# so the parallelism story is documented and stays stable across nvcc
# versions). Forwarded to every nvcc invocation via NVCC_APPEND_FLAGS.
nvcc_flags: --threads=1
# cmake is required by NATTEN's setup.py (checks for the executable at build
# time). Ninja generator is used.
extra_deps: cmake ninja
arch_list_by_cuda:
  # NATTEN's documented build floor is sm_80 (Ampere). Pre-Ampere arches
  # aren't listed as valid NATTEN_CUDA_ARCH values on natten.org/install,
  # even though the runtime check at backends/configs/checks.py is permissive
  # to sm_60. We track NATTEN's own supported matrix, not the runtime gate.
  #
  # Hopper (9.0) auto-enables -DNATTEN_WITH_HOPPER_FNA=1 in setup.py.
  # Blackwell DC (10.0/10.3) auto-enables -DNATTEN_WITH_BLACKWELL_FNA=1 and
  # requires CUDA 12.8+ — hence omitted from cu124/cu126 rows. Stripped from
  # Windows builds via patches/natten.py (MSVC can't parse the sm_100 FMHA
  # backward kernel templates).
  # Blackwell consumer (12.0, sm_120 / RTX 5090) doesn't trigger any
  # arch-specific NATTEN flags — it compiles via the regular CUTLASS-FNA
  # path and works on both Linux and Windows.
  '12.4': 8.0 8.6 8.9 9.0+PTX
  '12.6': 8.0 8.6 8.9 9.0+PTX
  '12.8': 8.0 8.6 8.9 9.0 10.0 12.0+PTX
  '12.9': 8.0 8.6 8.9 9.0 10.0 12.0+PTX
  '13.0': 8.0 8.6 8.9 9.0 10.0 10.3 12.0+PTX

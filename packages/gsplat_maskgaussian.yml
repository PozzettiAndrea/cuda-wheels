name: gsplat_maskgaussian
# HY-World 2.0's vendored gsplat fork with MaskGaussian densification +
# distloss. Lives at hyworld2/worldgen/third_party/gsplat_maskgaussian
# inside the Tencent-Hunyuan/HY-World-2.0 repo. README:
#   "Recommended: install the custom gsplat variant once for both
#    worldrecon and worldgen ... pip install -e . --no-build-isolation"
# Required by world_gs_trainer.py — it passes `distloss=`, `masks=`,
# `mask_gate=`, `gauss_masks=` kwargs to rasterization() that vanilla
# nerfstudio/gsplat HEAD doesn't yet have.
source_repo: Tencent-Hunyuan/HY-World-2.0
source_tag: ee5d5bc02c92671486ab6dd81f0cba577d0478c8
build_subdir: hyworld2/worldgen/third_party/gsplat_maskgaussian
# HY-World stripped GLM out of the maskgaussian fork; patch clones it
# back in. Patch also renames setup.py's `name="gsplat"` ->
# `name="gsplat_maskgaussian"` so the wheel filename gets its own
# release tag and doesn't clobber the vanilla gsplat v1.5.3 publication.
patch_script: patches/gsplat_maskgaussian.py
max_jobs: 2
# Inherit the full combinations matrix from _defaults.yml; restrict to
# Linux only. Override arch_list_by_cuda for cu12.4/12.6 to drop sm_5.0
# and sm_6.0 (Maxwell/Pascal) — gsplat HEAD uses cg::labeled_partition
# which requires sm_70+. Without this override, cu12.4/12.6 builds fail
# with "namespace 'cooperative_groups' has no member 'labeled_partition'".
# cu12.8+ default arch_lists already start at 7.0 / 7.5 so no override
# is needed there.
arch_list_by_cuda:
  "12.4": "7.0;7.5;8.0;8.6;9.0+PTX"
  "12.6": "7.0;7.5;8.0;8.6;9.0+PTX"
platforms: ["linux", "windows"]

name: cubvh
source_repo: ashawkey/cubvh
source_tag: ""

clone_recursive: true
free_disk_space: true
max_jobs: 2

build_matrix:
  combinations:
    - cuda: "12.4"
      pytorch: "2.4.0"
      python_versions: ["3.10", "3.11", "3.12"]
    - cuda: "12.8"
      pytorch: "2.8.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
  platforms: ["linux", "windows"]

name: faithc_aot
source_repo: PozzettiAndrea/faithc-aot
source_tag: v1.5.0-aot          # pinned tag on the fork (master @ 193bb9f)
clone_recursive: false
# No patch_script: the JIT->AOT conversion is committed in the fork.
# No extra_cuda_components: the 3 CUDA extensions
# atom3d.kernels.{cumtv,bvh,floodfill}_cuda use only torch + the standard CUDA
# runtime (no cub/thrust/curand/cufft). setup.py is at repo root (no build_subdir).

# Both platforms. Host cxx flag is platform-conditional in the fork setup.py
# (MSVC /O2 vs gcc -O3). Combinations inherited from _defaults.yml (cu124-cu130
# x torch 2.4-2.11 x py3.10-3.14) with their correct per-combo arch_lists.
build_matrix:
  platforms: ["linux", "windows"]

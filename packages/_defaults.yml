platforms: ["linux", "windows"]

# Standard arch list per CUDA version. Mirrors PyTorch's official build script
# at pytorch/.ci/manywheel/build_cuda.sh as of 2026-04-29.
#
# Forward-compat notes:
#   sm_75 SASS runs on Turing only.
#   sm_86 SASS forward-compat with sm_87/sm_89 (Ampere/Ada share SM ISA).
#   sm_90 SASS covers Hopper.
#   sm_100 SASS covers datacenter Blackwell (B100/B200/B300).
#   sm_120+PTX JIT-covers consumer Blackwell + DGX Spark + future SKUs.
arch_list_by_cuda:
  "12.4": "5.0;6.0;7.0;7.5;8.0;8.6;9.0"
  "12.6": "5.0;6.0;7.0;7.5;8.0;8.6;9.0"
  "12.8": "7.5;8.0;8.6;9.0;10.0"
  "12.9": "7.5;8.0;8.6;9.0;10.0"
  "13.0": "7.5;8.0;8.6;9.0;10.0;12.0+PTX"

# Default per-package settings inherited unless overridden.
defaults:
  max_jobs: 0           # 0 = ninja unlimited parallelism (homelab runners have RAM)
  clone_recursive: false
  free_disk_space: true

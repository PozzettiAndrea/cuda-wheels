# Inherited by every package YAML unless explicitly overridden.
# - `combinations` and `platforms` are used when a package YAML doesn't define
#   its own `build_matrix.combinations` / `build_matrix.platforms`.
# - Each combination carries an explicit `arch_list` based on PyTorch's
#   official build_cuda.sh for that release tag, with one override: we ALWAYS
#   add `+PTX` to the highest base arch (PyTorch only adds it on the current
#   frontier toolchain and rotates it off as toolchains mature; we keep it
#   everywhere so our wheels stay JIT-compatible with future GPUs).
#   Format matches TORCH_CUDA_ARCH_LIST: `X.Y;X.Y;X.Y+PTX`.
# - Resolution order at build time:
#     per-combo arch_list (this file or package YAML)
#     > pkg.arch_list_by_cuda[cuda]
#     > pkg.arch_list
# - The `_ensure_ptx_on_highest_base` normalizer in scripts/generate_matrix.py
#   re-applies the +PTX rule at resolve-time as a safety net, so any future
#   combo accidentally added without +PTX still gets one.

combinations:
  # ── cu124 (torch 2.4.0 – 2.6.0) ──
  - cuda: "12.4"
    pytorch: "2.4.0"
    python_versions: ["3.10", "3.11", "3.12"]
    arch_list: "5.0;6.0;7.0;7.5;8.0;8.6;9.0+PTX"
  - cuda: "12.4"
    pytorch: "2.5.0"
    python_versions: ["3.10", "3.11", "3.12", "3.13"]
    arch_list: "5.0;6.0;7.0;7.5;8.0;8.6;9.0+PTX"

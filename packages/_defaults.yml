# Inherited by every package YAML unless explicitly overridden.
# - `combinations` and `platforms` are used when a package YAML doesn't define
#   its own `build_matrix.combinations` / `build_matrix.platforms`.
# - `arch_list_by_cuda` is the standard arch list per CUDA toolkit version,
#   transcribed from pytorch/.ci/manywheel/build_cuda.sh. A package that
#   doesn't override falls through to this table.
# - Resolution order at build time:
#     per-combo arch_list  >  pkg.arch_list_by_cuda[cuda]  >
#     pkg.arch_list  >  _defaults.arch_list_by_cuda[cuda]

combinations:
  # ── cu124 (torch 2.4.0 – 2.6.0) ──
  - cuda: "12.4"
    pytorch: "2.4.0"
    python_versions: ["3.10", "3.11", "3.12"]
  - cuda: "12.4"
    pytorch: "2.5.0"

name: nvdiffrec_render
source_repo: NVlabs/nvdiffrec
version: "0.0.1"
source_tag: ""

free_disk_space: true
patch_script: patches/nvdiffrec_render.py
build_subdir: nvdiffrec_render

build_matrix:
  combinations:
    - cuda: "12.4"
      pytorch: "2.5.1"
      python_versions: ["3.10", "3.11", "3.12"]
    - cuda: "12.6"
      pytorch: "2.6.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "12.6"
      pytorch: "2.8.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "12.8"
      pytorch: "2.8.0"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "12.8"
      pytorch: "2.9.1"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
    - cuda: "13.0"
      pytorch: "2.9.1"
      python_versions: ["3.10", "3.11", "3.12", "3.13"]
  platforms: ["linux", "windows"]

extra_deps: "numpy"
